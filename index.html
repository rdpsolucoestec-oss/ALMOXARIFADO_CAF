:root{--onp:#fff;--bg:#e6f4e8;--hdr:#d3ebd7;--card:#f8fdf8;--ink:#14301f;--mut:#4d6e59;--line:#bcdcc3;--pri:#1d7a4a;--ok:#157a3d;--okb:#dcf3e3;--wt:#7a5200;--wb:#fcefc7;--bad:#b3261e;--badb:#fbe3e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onp:#06261a;--bg:#0c1f15;--hdr:#12291c;--card:#12291c;--ink:#e3f2e8;--mut:#90b59f;--line:#244a33;--pri:#5fd39a;--ok:#6fd392;--okb:#143a24;--wt:#f0c765;--wb:#40320c;--bad:#ff9a92;--badb:#47201d;color-scheme:dark}}
:root[data-theme="dark"]{--onp:#06261a;--bg:#0c1f15;--hdr:#12291c;--card:#12291c;--ink:#e3f2e8;--mut:#90b59f;--line:#244a33;--pri:#5fd39a;--ok:#6fd392;--okb:#143a24;--wt:#f0c765;--wb:#40320c;--bad:#ff9a92;--badb:#47201d;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.inp{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.inp:focus,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;background:var(--card);color:var(--ink)}
.bp{background:var(--pri);border-color:var(--pri);color:var(--onp)}
.bg{background:var(--ok);border-color:var(--ok);color:#fff}.br{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.by{background:var(--wb);color:var(--wt)}.bk{background:var(--okb);color:var(--ok)}.bx{background:var(--badb);color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:9px 14px;font-weight:500;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri)}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:6px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.sc{overflow-x:auto}.mut{color:var(--mut)}.err{color:var(--bad)}.okc{color:var(--ok)}
</style></head>

/* ---------- ADMINISTRADOR ---------- */
function Pedidos({db,up}){
 const [dt,setDt]=useState({});const [err,setErr]=useState({});
 const un=id=>db.unidades.find(u=>u.id===id)?.nome||'Unidade removida';
 const it=id=>db.itens.find(i=>i.id===id);
 const fechar=(p,ok)=>{
  if(ok){const f=p.itens.find(l=>(it(l.itemId)?.qtd||0)<l.qtd);if(f){setErr({...err,[p.id]:'Estoque insuficiente de '+(it(f.itemId)?.nome||'item removido')+'.'});return}}
  const data=dt[p.id]||hoje();
  up(d=>({...d,itens:ok?d.itens.map(i=>{const l=p.itens.find(x=>x.itemId===i.id);return l?{...i,qtd:i.qtd-l.qtd}:i}):d.itens,
   pedidos:d.pedidos.map(x=>x.id===p.id?{...x,status:ok?'Atendido':'Não atendido',entrega:data}:x)}));
  setErr({...err,[p.id]:''})};
 const lista=[...db.pedidos].reverse();
 if(!lista.length)return <p className="mut">Nenhum pedido recebido ainda.</p>;
 return <div className="grid gap-3 md:grid-cols-2">{lista.map(p=>(
  <div key={p.id} className="card">
   <div className="flex justify-between gap-2 mb-2"><div><p className="font-semibold">{un(p.unidadeId)}</p><p className="text-xs mut">Pedido {p.id} feito em {fd(p.data)} por {db.usuarios.find(u=>u.id===p.usuarioId)?.nome}</p></div><Badge t={p.status}/></div>
   <ul className="text-sm mb-3">{p.itens.map(l=><li key={l.itemId} className="flex justify-between border-b py-1" style={{borderColor:'var(--line)'}}>
    <span>{it(l.itemId)?.nome||'Item removido'}</span><span>{l.qtd} {it(l.itemId)?.un} <span className="mut">(estoque {it(l.itemId)?.qtd??0})</span></span></li>)}</ul>
   {p.status==='Pendente'?<div className="flex flex-wrap items-end gap-2">
    <Field l="Data de entrega"><input type="date" className="inp" value={dt[p.id]||hoje()} onChange={e=>setDt({...dt,[p.id]:e.target.value})}/></Field>
    <button className="btn bg" onClick={()=>fechar(p,true)}>Marcar como atendido</button>
    <button className="btn br" onClick={()=>fechar(p,false)}>Não atendido</button></div>
   :<p className="text-sm mut">{p.status==='Atendido'?'Entregue em ':'Encerrado em '}{fd(p.entrega)}</p>}
   {err[p.id]&&<p className="err text-sm mt-2">{err[p.id]}</p>}
  </div>))}</div>;
}

function Estoque({db,up}){
 const [f,setF]=useState(null);const [cf,setCf]=useState(null);const [e,setE]=useState('');
 const set=k=>ev=>setF({...f,[k]:ev.target.value});
 const salvar=ev=>{ev.preventDefault();const q=Number(f.qtd);
  if(!f.nome.trim()||f.qtd===''||isNaN(q)||q<0){setE('Informe o nome e uma quantidade igual ou maior que zero.');return}
  up(d=>({...d,itens:f.id?d.itens.map(i=>i.id===f.id?{...f,qtd:q}:i):[...d.itens,{...f,id:nid(),qtd:q}]}));setF(null);setE('')};
 return <div className="space-y-3">
  <button className="btn bp" onClick={()=>{setF({nome:'',cat:CATS[0],un:MED[0],qtd:''});setE('')}}>Cadastrar item</button>
  {f&&<form onSubmit={salvar} className="card grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
   <Field l="Nome do item"><input className="inp" value={f.nome} onChange={set('nome')}/></Field>
   <Field l="Categoria"><select className="inp" value={f.cat} onChange={set('cat')}>{CATS.map(c=><option key={c}>{c}</option>)}</select></Field>
   <Field l="Unidade de medida"><select className="inp" value={f.un} onChange={set('un')}>{MED.map(c=><option key={c}>{c}</option>)}</select></Field>
   <Field l="Quantidade atual"><input type="number" min="0" className="inp" value={f.qtd} onChange={set('qtd')}/></Field>
   {e&&<p className="err text-sm sm:col-span-2 lg:col-span-4">{e}</p>}
   <div className="flex gap-2 sm:col-span-2 lg:col-span-4"><button className="btn bp">Salvar item</button><button type="button" className="btn" onClick={()=>setF(null)}>Cancelar</button></div></form>}
  <div className="card sc"><table><thead><tr><th>Item</th><th>Categoria</th><th>Medida</th><th>Saldo</th><th>Situação</th><th></th></tr></thead><tbody>
   {db.itens.map(i=><tr key={i.id}><td className="font-medium">{i.nome}</td><td>{i.cat}</td><td>{i.un}</td><td>{i.qtd}</td><td><Badge t={i.qtd>0?'Disponível':'Indisponível'}/></td>
    <td className="whitespace-nowrap text-right"><button className="btn mr-1" onClick={()=>{setF(i);setE('')}}>Editar</button>
     {cf===i.id?<button className="btn br" onClick={()=>{up(d=>({...d,itens:d.itens.filter(x=>x.id!==i.id)}));setCf(null)}}>Confirmar exclusão</button>:<button className="btn br" onClick={()=>setCf(i.id)}>Excluir</button>}</td></tr>)}
  </tbody></table></div></div>;
}

function Limites({db,up}){
 const [u,setU]=useState(db.unidades[0]?.id);
 const usado=iid=>db.pedidos.filter(p=>p.unidadeId===u&&p.status!=='Não atendido'&&mes(p.data)===mes(hoje())).flatMap(p=>p.itens).filter(l=>l.itemId===iid).reduce((s,l)=>s+l.qtd,0);
 const set=(iid,v)=>up(d=>{const l={...d.limites},k=u+'-'+iid;if(v==='')delete l[k];else l[k]=Math.max(0,Number(v));return{...d,limites:l}});
 if(!db.unidades.length)return <p className="mut">Cadastre uma unidade primeiro.</p>;
 return <div className="space-y-3">
  <div className="max-w-xs"><Field l="Unidade requisitante"><select className="inp" value={u} onChange={e=>setU(Number(e.target.value))}>{db.unidades.map(x=><option key={x.id} value={x.id}>{x.nome}</option>)}</select></Field></div>
  <p className="text-sm mut">Teto de consumo por mês. Deixe em branco para não limitar (vale só o saldo do estoque).</p>
  <div className="card sc"><table><thead><tr><th>Item</th><th>Medida</th><th>Já pedido neste mês</th><th>Limite mensal</th></tr></thead><tbody>
   {db.itens.map(i=><tr key={i.id}><td className="font-medium">{i.nome}</td><td>{i.un}</td><td>{usado(i.id)}</td>
    <td style={{width:140}}><input type="number" min="0" className="inp" placeholder="Sem limite" value={db.limites[u+'-'+i.id]??''} onChange={e=>set(i.id,e.target.value)}/></td></tr>)}
  </tbody></table></div></div>;
}

function Unidades({db,up}){
 const [n,setN]=useState('');const [t,setT]=useState(TIPOS[0]);const [e,setE]=useState('');
 const add=ev=>{ev.preventDefault();if(!n.trim()){setE('Informe o nome da unidade.');return}up(d=>({...d,unidades:[...d.unidades,{id:nid(),nome:n.trim(),tipo:t}]}));setN('');setE('')};
 const del=u=>{if(db.usuarios.some(x=>x.unidadeId===u.id)||db.pedidos.some(p=>p.unidadeId===u.id)){setE(u.nome+' tem usuários ou pedidos e não pode ser excluída.');return}setE('');up(d=>({...d,unidades:d.unidades.filter(x=>x.id!==u.id)}))};
 return <div className="space-y-3">
  <form onSubmit={add} className="card flex flex-wrap items-end gap-3"><div className="grow"><Field l="Nome da unidade"><input className="inp" value={n} onChange={ev=>setN(ev.target.value)} placeholder="Ex.: UBS Vila Nova"/></Field></div>
   <Field l="Tipo"><select className="inp" value={t} onChange={ev=>setT(ev.target.value)}>{TIPOS.map(x=><option key={x}>{x}</option>)}</select></Field><button className="btn bp">Cadastrar unidade</button></form>
  {e&&<p className="err text-sm">{e}</p>}
  <div className="card sc"><table><thead><tr><th>Nome (editável)</th><th>Tipo</th><th>Usuários</th><th></th></tr></thead><tbody>
   {db.unidades.map(u=><tr key={u.id}><td><input className="inp" value={u.nome} onChange={ev=>up(d=>({...d,unidades:d.unidades.map(x=>x.id===u.id?{...x,nome:ev.target.value}:x)}))}/></td>
    <td>{u.tipo}</td><td>{db.usuarios.filter(x=>x.unidadeId===u.id).length}</td><td className="text-right"><button className="btn br" onClick={()=>del(u)}>Excluir</button></td></tr>)}
  </tbody></table></div></div>;
}

function Usuarios({db,up}){
 const st=(id,status)=>up(d=>({...d,usuarios:d.usuarios.map(u=>u.id===id?{...u,status}:u)}));
 return <div className="card sc"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Unidade</th><th>Situação</th><th></th></tr></thead><tbody>
  {db.usuarios.map(u=><tr key={u.id}><td className="font-medium">{u.nome}</td><td>{u.email}</td><td>{db.unidades.find(x=>x.id===u.unidadeId)?.nome}</td><td><Badge t={u.status}/></td>
   <td className="text-right whitespace-nowrap">{u.status!=='aprovado'&&<button className="btn bg mr-1" onClick={()=>st(u.id,'aprovado')}>Aprovar</button>}{u.status!=='rejeitado'&&<button className="btn br" onClick={()=>st(u.id,'rejeitado')}>Rejeitar</button>}</td></tr>)}
 </tbody></table></div>;
}

function Admin({db,up}){
 const [tab,setTab]=useState('pedidos');
 const T=[['pedidos','Pedidos',db.pedidos.filter(p=>p.status==='Pendente').length],['estoque','Estoque'],['limites','Limites por unidade'],['unidades','Unidades'],['usuarios','Usuários',db.usuarios.filter(u=>u.status==='pendente').length]];
 const C={pedidos:Pedidos,estoque:Estoque,limites:Limites,unidades:Unidades,usuarios:Usuarios}[tab];
 return <div><div className="tabs">{T.map(([k,l,n])=><button key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>setTab(k)}>{l}{n>0&&<span className="dot">{n}</span>}</button>)}</div><C db={db} up={up}/></div>;
}

/* ---------- USUÁRIO (UNIDADE) ---------- */
function Auth({db,up,onLogin}){
 const [m,setM]=useState('login');const [f,setF]=useState({nome:'',email:'',unidadeId:db.unidades[0]?.id||'',auto:false});const [msg,setMsg]=useState('');
 const s=k=>e=>setF({...f,[k]:e.target.value});
 const go=e=>{e.preventDefault();const em=f.email.trim().toLowerCase();
  if(m==='login'){const u=db.usuarios.find(x=>x.email===em);
   if(!u)return setMsg('E-mail não encontrado. Crie uma conta.');
   if(u.status==='pendente')return setMsg('Seu cadastro ainda aguarda aprovação do administrador.');
   if(u.status==='rejeitado')return setMsg('Cadastro rejeitado. Procure o administrador.');
   return onLogin(u.id)}
  if(!f.nome.trim()||!em)return setMsg('Preencha nome e e-mail.');
  if(!f.unidadeId)return setMsg('Não há unidades cadastradas.');
  if(db.usuarios.some(x=>x.email===em))return setMsg('Este e-mail já está cadastrado.');
  const u={id:nid(),nome:f.nome.trim(),email:em,unidadeId:Number(f.unidadeId),status:f.auto?'aprovado':'pendente'};
  up(d=>({...d,usuarios:[...d.usuarios,u]}));
  if(f.auto)onLogin(u.id);else{setM('login');setMsg('Cadastro enviado. Aprove-o na Visão do Administrador, aba Usuários.')}};
 return <div className="card max-w-md mx-auto mt-6 space-y-3"><div className="flex justify-center py-2"><Logo k="l" w={250}/></div>
  <div className="tabs" style={{marginBottom:0}}>{[['login','Entrar'],['cad','Criar conta']].map(([k,l])=><button key={k} className={'tab '+(m===k?'on':'')} onClick={()=>{setM(k);setMsg('')}}>{l}</button>)}</div>
  <form onSubmit={go} className="space-y-3">
   {m==='cad'&&<Field l="Nome completo"><input className="inp" value={f.nome} onChange={s('nome')}/></Field>}
   <Field l="E-mail"><input type="email" className="inp" value={f.email} onChange={s('email')}/></Field>
   {m==='cad'&&<Field l="Unidade de saúde"><select className="inp" value={f.unidadeId} onChange={s('unidadeId')}>{db.unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}</select></Field>}
   {m==='cad'&&<label className="flex gap-2 text-sm"><input type="checkbox" checked={f.auto} onChange={e=>setF({...f,auto:e.target.checked})}/>Acesso direto, sem aprovação (modo de teste)</label>}
   {msg&&<p className={'text-sm '+(msg.startsWith('Cadastro enviado')?'okc':'err')}>{msg}</p>}
   <button className="btn bp w-full">{m==='login'?'Entrar':'Criar conta'}</button></form>
  {m==='login'&&<p className="text-xs mut">Para testar, entre com ana@ubs.gov (UBS Centro). A senha não é verificada neste protótipo.</p>}</div>;
}

function Portal({db,up,user,sair}){
 const [tab,setTab]=useState('catalogo');const [cart,setCart]=useState({});const [qs,setQs]=useState({});const [q,setQ]=useState('');const [err,setErr]=useState('');const [ok,setOk]=useState('');
 const uid=user.unidadeId;const un=db.unidades.find(u=>u.id===uid)?.nome;
 const usado=iid=>db.pedidos.filter(p=>p.unidadeId===uid&&p.status!=='Não atendido'&&mes(p.data)===mes(hoje())).flatMap(p=>p.itens).filter(l=>l.itemId===iid).reduce((s,l)=>s+l.qtd,0);
 const lim=iid=>db.limites[uid+'-'+iid];
 const resta=i=>lim(i.id)===undefined?Infinity:Math.max(0,lim(i.id)-usado(i.id));
 const add=i=>{const n=Math.floor(Number(qs[i.id]||1));const tot=(cart[i.id]||0)+n;setOk('');
  if(!(n>0))return setErr('Informe uma quantidade válida.');
  if(tot>i.qtd)return setErr('Saldo de '+i.nome+': apenas '+i.qtd+' '+i.un+'.');
  if(tot>resta(i))return setErr('Limite mensal de '+i.nome+' excedido. Ainda pode pedir '+resta(i)+'.');
  setErr('');setCart({...cart,[i.id]:tot})};
 const enviar=()=>{const itens=Object.entries(cart).map(([k,v])=>({itemId:Number(k),qtd:v}));if(!itens.length)return;
  up(d=>({...d,pedidos:[...d.pedidos,{id:nid(),unidadeId:uid,usuarioId:user.id,data:hoje(),status:'Pendente',entrega:null,itens}]}));setCart({});setErr('');setOk('Pedido enviado ao almoxarifado.');setTab('historico')};
 const nc=Object.keys(cart).length;
 const hist=[...db.pedidos].filter(p=>p.unidadeId===uid).reverse();
 const itens=db.itens.filter(i=>i.nome.toLowerCase().includes(q.toLowerCase()));
 return <div>
  <div className="flex justify-between items-center mb-3 gap-2"><p><span className="font-semibold">{user.nome}</span> <span className="mut">de {un}</span></p><button className="btn" onClick={sair}>Sair</button></div>
  <div className="tabs">{[['catalogo','Catálogo'],['carrinho','Meu pedido'+(nc?' ('+nc+')':'')],['historico','Histórico']].map(([k,l])=><button key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
  {ok&&<p className="okc text-sm mb-2">{ok}</p>}
  {tab==='catalogo'&&<div className="space-y-3">
   <input className="inp max-w-sm" placeholder="Buscar item" value={q} onChange={e=>setQ(e.target.value)}/>
   {err&&<p className="err text-sm">{err}</p>}
   <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">{itens.map(i=>{const off=i.qtd<=0;const r=resta(i);return(
    <div key={i.id} className="card" style={off?{opacity:.75}:null}>
     <div className="flex justify-between gap-2"><div><p className="font-semibold">{i.nome}</p><p className="text-xs mut">{i.cat}</p></div><Badge t={off?'Indisponível':'Disponível'}/></div>
     <p className="text-sm mt-2">{off?'Sem saldo no almoxarifado.':'Saldo: '+i.qtd+' '+i.un}</p>
     <p className="text-xs mut">{lim(i.id)===undefined?'Sem limite mensal definido.':'Limite mensal: '+lim(i.id)+', pode pedir mais '+r+'.'}</p>
     <div className="flex gap-2 mt-3"><input type="number" min="1" className="inp" style={{width:90}} value={qs[i.id]??1} disabled={off} onChange={e=>setQs({...qs,[i.id]:e.target.value})}/>
      <button className="btn bp grow" disabled={off||r===0} onClick={()=>add(i)}>{r===0&&!off?'Limite atingido':'Adicionar ao pedido'}</button></div></div>)})}</div></div>}
  {tab==='carrinho'&&<div className="card space-y-3">{nc===0?<p className="mut">Seu pedido está vazio. Adicione itens pelo catálogo.</p>:<>
   <table><thead><tr><th>Item</th><th>Quantidade</th><th></th></tr></thead><tbody>{Object.entries(cart).map(([k,v])=>{const i=db.itens.find(x=>x.id===Number(k));return <tr key={k}><td>{i?.nome}</td><td>{v} {i?.un}</td>
    <td className="text-right"><button className="btn br" onClick={()=>{const c={...cart};delete c[k];setCart(c)}}>Remover</button></td></tr>})}</tbody></table>
   <button className="btn bp" onClick={enviar}>Enviar pedido</button></>}</div>}
  {tab==='historico'&&<div className="space-y-3">{hist.length===0?<p className="mut">Sua unidade ainda não fez pedidos.</p>:hist.map(p=>
   <div key={p.id} className="card"><div className="flex justify-between gap-2"><p className="font-semibold">Pedido {p.id}, feito em {fd(p.data)}</p><Badge t={p.status}/></div>
    <ul className="text-sm my-2">{p.itens.map(l=>{const i=db.itens.find(x=>x.id===l.itemId);return <li key={l.itemId}>{l.qtd} {i?.un}, {i?.nome||'item removido'}</li>})}</ul>
    <p className="text-sm mut">{p.status==='Pendente'?'Aguardando análise do almoxarifado.':(p.status==='Atendido'?'Entregue em ':'Não atendido em ')+fd(p.entrega)}</p></div>)}</div>}
 </div>;
}

function Unidade({db,up}){
 const [uid,setUid]=useState(null);const user=db.usuarios.find(u=>u.id===uid);
 if(!user||user.status!=='aprovado')return <Auth db={db} up={up} onLogin={setUid}/>;
 return <Portal db={db} up={up} user={user} sair={()=>setUid(null)}/>;
}

function App(){
 const [db,setDb]=useState(init);const [role,setRole]=useState('adm');
 return <div>
  <header style={{background:'var(--hdr)',borderBottom:'1px solid var(--line)'}}><div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
   <div className="flex items-center gap-3"><Logo k="s" h={44}/><div><p className="font-semibold text-lg" style={{color:'var(--pri)'}}>Almoxarifado da Saúde</p><p className="text-xs mut">Secretaria Municipal de Saúde</p></div></div>
   <div className="flex" role="group" aria-label="Alternar visão">{[['adm','Visão do Administrador'],['user','Visão da Unidade']].map(([k,l],i)=>
    <button key={k} onClick={()=>setRole(k)} className={'btn '+(role===k?'bp':'')} style={{borderRadius:i?'0 8px 8px 0':'8px 0 0 8px'}}>{l}</button>)}</div></div></header>
  <main className="max-w-6xl mx-auto px-4 py-5">{role==='adm'?<Admin db={db} up={setDb}/>:<Unidade db={db} up={setDb}/>}</main>
  <footer className="text-center pb-8 text-xs mut"><p>Sistema desenvolvido por</p><div className="flex justify-center mt-1"><Logo k="l" w={150}/></div></footer></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
